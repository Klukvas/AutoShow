name: Deploy selected installation

on:
  workflow_dispatch:
    inputs:
      installation:
        description: 'Existing installation ID (GitHub Environment installation-ID)'
        required: true
      release_run_id:
        description: 'Successful Release workflow run containing the immutable bundle'
        required: true
      release_sha:
        description: 'Full source SHA of that release'
        required: true
      operation:
        type: choice
        options: [update, bootstrap, rollback]
        default: update

permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-${{ inputs.installation }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: installation-${{ inputs.installation }}
    steps:
      - name: Validate explicit target
        env:
          INSTALLATION: ${{ inputs.installation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          [[ "$INSTALLATION" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
      - name: Verify successful Release run and source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          EXPECTED_WORKFLOW_ID=$(gh api "repos/$GH_REPO/actions/workflows/release.yml" --jq .id)
          export EXPECTED_WORKFLOW_ID
          gh api "repos/$GH_REPO/actions/runs/$RELEASE_RUN_ID" > run.json
          node -e 'const r=require("./run.json"); if(r.conclusion!=="success"||r.head_sha!==process.env.RELEASE_SHA||String(r.workflow_id)!==process.env.EXPECTED_WORKFLOW_ID) process.exit(1)'
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.installation }}-${{ inputs.release_sha }}-${{ inputs.release_run_id }}
          path: bundle
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
      - name: Validate bundle target and checksums
        env:
          INSTALLATION: ${{ inputs.installation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test "$(cat bundle/installation-id)" = "$INSTALLATION"
          test "$(cat bundle/source-sha)" = "$RELEASE_SHA"
          cd bundle
          sha256sum --check SHA256SUMS
      - name: Copy immutable bundle to selected server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: 'bundle/*'
          target: /opt/autoflow/releases/${{ inputs.release_sha }}-${{ inputs.installation }}-${{ inputs.release_run_id }}
          strip_components: 1
          overwrite: false
      - name: Apply selected bundle
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          INSTALLATION: ${{ inputs.installation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: INSTALLATION,RELEASE_SHA,OPERATION,RELEASE_RUN_ID
          script: |
            set -eu
            cd /opt/autoflow
            test "$(sed -n 's/^INSTALLATION_ID=//p' .env)" = "$INSTALLATION"
            BUNDLE="$RELEASE_SHA-$INSTALLATION-$RELEASE_RUN_ID"
            cd "releases/$BUNDLE"
            sha256sum --check SHA256SUMS
            bash bin/installation.sh "$OPERATION" /opt/autoflow "$BUNDLE"
