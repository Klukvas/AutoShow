name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typecheck, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Build catches RSC/route errors that tsc alone misses. The design is chosen at
      # build time, so every theme folder is built: a broken theme cannot merge.
      - name: Build every storefront theme
        run: |
          for theme_dir in src/themes/*/; do
            theme=$(basename "$theme_dir")
            echo "::group::next build (STOREFRONT_THEME=$theme)"
            STOREFRONT_THEME="$theme" npm run build
            echo "::endgroup::"
          done
        env:
          NEXT_TELEMETRY_DISABLED: 1
