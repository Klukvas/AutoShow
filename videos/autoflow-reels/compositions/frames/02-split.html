    <div data-hf-id="hf-m5kc" id="f02-callout-2" class="f02-callout-row">
      <span data-hf-id="hf-xurm" id="f02-callout-2-pill" class="f02-callout">3 тапи</span>
    </div>
  </div>

  <script>
    (function () {
      const byId = (suffix) => document.querySelector('[id="f02-' + suffix + '"]');
      const tl = gsap.timeline({ paused: true });

      // ---------- LEFT: deterministic flood of buyer questions ----------
      const MESSAGES = [
        ["Ціна?", "oleh.k"], ["Ще актуально?", "marina_lviv"], ["А є дешевше?", "vitya_auto"],
        ["Який пробіг?", "andrii.ua"], ["Розмитнена?", "sasha.kh"], ["Ціна?", "ira.dnipro"],
        ["Скиньте фото салону", "max_odesa"], ["Торг є?", "taras.v"], ["Яка комплектація?", "yulia_k"],
        ["Ще актуально?", "dima.rv"], ["Є щось до 15к?", "oleh.k"], ["Кредит можна?", "marina_lviv"],
        ["Ціна?", "vitya_auto"], ["Ау?", "andrii.ua"], ["Торг є?", "sasha.kh"],
        ["Який пробіг?", "ira.dnipro"], ["Чому не відповідаєте?", "oleh.k"], ["Розмитнена?", "max_odesa"],
        ["Ціна?", "taras.v"], ["А є дешевше?", "yulia_k"], ["Скиньте фото салону", "dima.rv"],
        ["Ще актуально?", "marina_lviv"], ["Кредит можна?", "vitya_auto"], ["Яка комплектація?", "andrii.ua"],
        ["Ціна?", "sasha.kh"], ["Чому не відповідаєте?", "oleh.k"], ["Торг є?", "ira.dnipro"],
        ["Є щось до 15к?", "max_odesa"], ["Ау?", "taras.v"], [null, ""]
      ];
      // Arrival times: ~0.45s cadence (Scene 2) → 0.25s (Scene 3) → 0.2s (Scene 4/5), then the last "Ау?" + typing.
      const ARRIVALS = [
        0.25, 0.6,
        1.1, 1.55, 2.0, 2.45, 2.9, 3.35, 3.8,
        4.0, 4.25, 4.5, 4.75,
        5.0, 5.2, 5.4, 5.6, 5.8, 6.0, 6.2, 6.4, 6.6, 6.8, 7.0,
        7.2, 7.38, 7.56, 7.74,
        8.75, 9.1
      ];
      const ROW_HEIGHT = 52;
      const VIEWPORT_HEIGHT = 568;
      const BOTTOM_PAD = 8;
      const AVATAR_TONES = ["#3A3A3C", "#48484A", "#2C2C2E", "#545456"];
      const X_JITTER = [0, 6, -2, 10, 3, -4, 8, 1, 12, -3, 5, 9, 0, 7, -2, 11];
      // Rows overlap slightly once the flood peaks (Scene 4 on).
      const rowSpacing = (index) => (index >= 28 ? 60 : index >= 24 ? 44 : index >= 13 ? 49 : 60);
      const rowJitter = (index) => (index >= 13 && index < 28 ? X_JITTER[index % X_JITTER.length] : 0);

      const thread = byId("lthread");
      const rowTops = MESSAGES.reduce((tops, _msg, index) => {
        const top = index === 0 ? 0 : tops[index - 1] + rowSpacing(index);
        return tops.concat(top);
      }, []);

      const rows = MESSAGES.map(([text, handle], index) => {
        const row = document.createElement("div");
        row.className = "f02-row";
        row.id = "f02-lrow-" + index;
        row.style.top = rowTops[index] + "px";
        row.style.left = 14 + rowJitter(index) + "px";
        const avatar = document.createElement("div");
        avatar.className = "f02-ava";
        avatar.style.background = AVATAR_TONES[index % AVATAR_TONES.length];
        avatar.textContent = handle ? handle.charAt(0).toUpperCase() : "";
        const bubble = document.createElement("div");
        bubble.className = "f02-bubble";
        if (text === null) {
          bubble.innerHTML = '<span class="f02-dots"><i></i><i></i><i></i></span>';
        } else {
          bubble.textContent = text;
          const handleEl = document.createElement("div");
          handleEl.className = "f02-handle";
          handleEl.textContent = handle;
          row.appendChild(handleEl);
        }
        row.appendChild(avatar);
        row.appendChild(bubble);
        thread.appendChild(row);
        return row;
      });

      const threadYAfter = (count) => (count === 0 ? VIEWPORT_HEIGHT - BOTTOM_PAD : VIEWPORT_HEIGHT - BOTTOM_PAD - (rowTops[count - 1] + ROW_HEIGHT));
      tl.set(thread, { y: threadYAfter(0) }, 0);
      rows.forEach((row, index) => {
        const at = ARRIVALS[index];
        const gap = index === 0 ? 0.3 : at - ARRIVALS[index - 1];
        tl.fromTo(
          thread,
          { y: threadYAfter(index) },
          { y: threadYAfter(index + 1), duration: Math.min(0.24, gap * 0.85), ease: "power3.out", immediateRender: false },
          at
        );
        tl.fromTo(
          row,
          { opacity: 0, y: 14, scale: 0.96 },
          { opacity: 1, y: 0, scale: 1, duration: 0.26, ease: "back.out(1.15)" },
          at
        );
      });

      // Typing dots on the last left row pulse a few times, then freeze — it never resolves.
      const leftDots = rows[rows.length - 1].querySelectorAll(".f02-dots i");
      for (let cycle = 0; cycle < 4; cycle += 1) {
        leftDots.forEach((dot, dotIndex) => {
          const start = 9.3 + cycle * 0.36 + dotIndex * 0.1;
          tl.fromTo(dot, { opacity: 0.35 }, { opacity: 1, duration: 0.14, ease: "sine.inOut", immediateRender: false }, start);
          tl.fromTo(dot, { opacity: 1 }, { opacity: 0.35, duration: 0.14, ease: "sine.inOut", immediateRender: false }, start + 0.14);
        });
      }

      // Unread counter 12 → 87 → 140 → 198 → 243 (then stops).
      const badge = byId("badge");
      const counter = { value: 12 };
      const renderCount = () => { badge.textContent = String(Math.round(counter.value)); };
      [[12, 87, 1.0, 2.8], [87, 140, 4.0, 0.8], [140, 198, 5.0, 2.0], [198, 243, 7.2, 0.8]].forEach(([from, to, at, duration]) => {
        tl.fromTo(counter, { value: from }, { value: to, duration, ease: "none", onUpdate: renderCount, immediateRender: false }, at);
        tl.fromTo(badge, { scale: 1 }, { scale: 1.18, duration: 0.1, ease: "power2.out", immediateRender: false }, at + duration - 0.05);
        tl.fromTo(badge, { scale: 1.18 }, { scale: 1, duration: 0.18, ease: "power2.out", immediateRender: false }, at + duration + 0.05);
      });

      // Scene 5: short low-amplitude shake, then the inbox dims.
      const phoneLeft = byId("phone-left");
      const SHAKE = [9, -8, 7, -6, 4, -3, 0];
      SHAKE.forEach((x, index) => {
        tl.to(phoneLeft, { x, duration: 0.045, ease: "sine.inOut" }, 7.95 + index * 0.045);
      });
      tl.fromTo(byId("ldim"), { opacity: 0 }, { opacity: 0.55, duration: 0.6, ease: "power2.out" }, 8.25);
      tl.to(byId("label-left"), { opacity: 0.32, duration: 0.6, ease: "power2.out" }, 8.25);
      tl.to(byId("glow-left"), { opacity: 0, duration: 0.8, ease: "power2.out" }, 8.25);

      // ---------- Ambient + Scene 1 screen light-up ----------
      tl.fromTo(byId("vignette"), { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out" }, 0);
      tl.fromTo(byId("glow-left"), { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out" }, 0.1);
      tl.fromTo(byId("lcontent"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.05);
      tl.fromTo(byId("rchat"), { opacity: 0, scale: 1 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.fromTo(byId("label-left"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.4);
      tl.fromTo(byId("label-right"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.5);

      // ---------- RIGHT: one link, three taps ----------
      const rout = byId("rout");
      const linkCard = byId("linkcard");
      tl.fromTo(rout, { opacity: 0, y: 40, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 1.4);
      tl.fromTo(linkCard, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.55);

      const ripple = (index, at) => {
        tl.fromTo(byId("ripple-" + index), { opacity: 0, scale: 0.2 }, { opacity: 0.9, scale: 0.55, duration: 0.12, ease: "power2.out" }, at);
        tl.fromTo(byId("ripple-" + index), { opacity: 0.9, scale: 0.55 }, { opacity: 0, scale: 1.25, duration: 0.5, ease: "power2.out", immediateRender: false }, at + 0.12);
      };
      const press = (target, at, depth) => {
        tl.fromTo(target, { scale: 1 }, { scale: depth, duration: 0.11, ease: "power2.out", immediateRender: false }, at);
        tl.fromTo(target, { scale: depth }, { scale: 1, duration: 0.18, ease: "power2.out", immediateRender: false }, at + 0.11);
      };

      // Scene 3 — tap #0 on the link card, chat hands off to the catalog sheet.
      ripple(0, 4.0);
      press(linkCard, 4.0, 0.97);
      const rchat = byId("rchat");
      const rcars = byId("rcars");
      tl.to(rchat, { scale: 0.94, opacity: 0, duration: 0.38, ease: "power2.in" }, 4.28);
      tl.fromTo(rcars, { opacity: 0, y: 300, scale: 0.98 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, 4.3);

      // Scene 4 — a Toyota chip slides into the make row, tap #1, filtered list (2 авто).
      const chip = byId("chip");
      tl.fromTo(chip, { opacity: 0, x: -130 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 5.1);
      ripple(1, 5.9);
      press(chip, 5.9, 0.93);
      const rtoyota = byId("rtoyota");
      tl.fromTo(rtoyota, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 6.18);
      tl.fromTo(byId("callout-1-pill"), { opacity: 0, scale: 0.6, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.7)" }, 6.55);

      // Scene 5 — tap #2 on the Camry card, the listing page pushes in.
      ripple(2, 7.45);
      const rcamry = byId("rcamry");
      tl.fromTo(rcamry, { x: 410 }, { x: 0, duration: 0.5, ease: "power3.out" }, 7.7);
      tl.to(rtoyota, { x: -110, duration: 0.5, ease: "power3.out" }, 7.7);
      tl.fromTo(byId("callout-2-pill"), { opacity: 0, scale: 0.6, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.7)" }, 8.3);

      // Scene 6 — back to the chat (reverse sheet), buyer types, "Беру".
      tl.set([rcars, rtoyota], { opacity: 0 }, 9.4);
      tl.to(rcamry, { y: 760, duration: 0.5, ease: "power2.in" }, 9.4);
      tl.to(rchat, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 9.5);
      tl.to(rout, { y: -50, duration: 0.4, ease: "power3.out" }, 10.0);
      const rtyping = byId("rtyping");
      tl.fromTo(rtyping, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 10.0);
      [0, 1].forEach((cycle) => {
        [0, 1, 2].forEach((dotIndex) => {
          const dot = byId("rdot-" + dotIndex);
          const start = 10.1 + cycle * 0.3 + dotIndex * 0.08;
          tl.fromTo(dot, { opacity: 0.35 }, { opacity: 1, duration: 0.12, ease: "sine.inOut", immediateRender: false }, start);
          tl.fromTo(dot, { opacity: 1 }, { opacity: 0.35, duration: 0.12, ease: "sine.inOut", immediateRender: false }, start + 0.12);
        });
      });
      tl.to(rtyping, { opacity: 0, duration: 0.12, ease: "power1.out" }, 10.68);
      tl.fromTo(byId("rincoming"), { opacity: 0, y: 12, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "back.out(1.2)" }, 10.7);
      tl.fromTo(byId("in-glow"), { opacity: 0 }, { opacity: 0.85, duration: 0.8, ease: "power2.out" }, 10.8);
      const glowRight = byId("glow-right");
      tl.fromTo(glowRight, { opacity: 0, scale: 0.85 }, { opacity: 0.42, scale: 1, duration: 1.4, ease: "power2.out" }, 10.75);

      // Scene 7 — held read; only a hair of jitter on the coral glow.
      tl.to(glowRight, { scale: 1.025, opacity: 0.45, duration: 0.5, ease: "sine.inOut" }, 12.15);
      tl.to(glowRight, { scale: 1, opacity: 0.42, duration: 0.35, ease: "sine.inOut" }, 12.65);

      tl.set({}, {}, 13);

      window.__timelines = window.__timelines || {};
      window.__timelines["02-split"] = tl;
    })();
  </script>
