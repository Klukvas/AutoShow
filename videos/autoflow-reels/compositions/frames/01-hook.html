      const words = ["w1", "w2", "w3", "w4"].map(byId);

      const tl = gsap.timeline({ paused: true });

          word,
          { y: 70, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
          wordStarts[index]
        );
      });

      // Scene 2 (1.3–2.5s): headline shrinks and travels to the top; phones rise into the split, left first.
      tl.fromTo(
        headline,
        { y: SCENE1_OFFSET_Y, scale: 1.02 },
        { y: 0, scale: LANDED_SCALE, duration: 0.75, ease: "power3.inOut", immediateRender: false },
        1.3
      );

        phoneLeft,
        { y: PHONE_RISE_Y, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
