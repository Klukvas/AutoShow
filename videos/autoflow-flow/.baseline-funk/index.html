    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        '.continuity-car',
        { x: 0, y: 0, scale: 1, opacity: 0 },
        { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.75, ease: 'power3.out' },
        0.3,
      );
      tl.to(
        '.continuity-car',
        { x: 115, y: -55, scale: 0.785, duration: 1.2, ease: 'power3.inOut' },
        3.6,
      );
      tl.to('.continuity-car', { opacity: 0, duration: 0.15 }, 4.9);
      window.__timelines['autoflow-flow'] = tl;
