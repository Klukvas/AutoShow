<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><title>Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--bg:#f3f4f6;--acc:#0f766e;--accbg:#ccfbf1;--viber:#7360f2;--tg:#229ed9;--call:#16a34a}
*{box-sizing:border-box;margin:0}
body{width:1448px;height:1086px;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink)}
header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;padding:0 32px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}.logo b{color:var(--acc)}
.search{flex:1;max-width:560px;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;align-items:center;padding:0 14px;color:var(--mut);font-size:14px;gap:10px}
.hr{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:14px;font-weight:600}
.btn{height:42px;padding:0 18px;border-radius:10px;display:inline-flex;align-items:center;font-weight:700;font-size:14px}
.btn.p{background:var(--acc);color:#fff}
.wrap{display:flex;gap:24px;padding:20px 32px}
aside{width:264px;flex:none;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;height:fit-content}
aside h3{font-size:16px;margin-bottom:14px}
.f{margin-bottom:14px}.f label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.sel{height:40px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:14px;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:7px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600}
.chip.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
.show{margin-top:6px;height:46px;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
main{flex:1}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}.top h1 span{color:var(--mut);font-weight:600;font-size:15px;margin-left:8px}
.sort{display:flex;gap:10px;font-size:14px;font-weight:600}
.pill{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ph{height:178px;position:relative;background:#ddd}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:10px;top:10px;background:rgba(17,24,39,.85);color:#fff;font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:7px}
.badge.g{background:var(--acc)}
.heart{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center}
.cnt{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;padding:3px 8px;border-radius:6px;font-weight:600}
.bd{padding:12px 14px 14px}
.pr{display:flex;align-items:baseline;gap:8px}.pr b{font-size:22px;font-weight:800;letter-spacing:-.5px}.pr s{text-decoration:none;color:var(--mut);font-size:12.5px;font-weight:500}
.tt{font-size:15px;font-weight:700;margin:3px 0 7px}
.sp{font-size:12.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 12px}
.ct{font-size:12.5px;color:var(--mut);margin-top:6px;display:flex;justify-content:space-between}
.act{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:7px;margin-top:11px}
.a{height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;color:#fff;font-weight:700;font-size:13px}
.a svg{width:16px;height:16px;fill:#fff}
</style></head><body>
<header>
  <div class="logo">Auto<b>Flow</b></div>
  <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Марка, модель або ключове слово</div>
  <div class="hr"><span>Вибране (3)</span><span>+38 067 448 20 10</span><span class="btn p">Продати авто</span></div>
</header>
<div class="wrap">
  <aside>
    <h3>Фільтри</h3>
    <div class="f"><label>Марка</label><div class="sel">BMW, Audi <span>⌄</span></div></div>
    <div class="f"><label>Модель</label><div class="sel">Усі моделі <span>⌄</span></div></div>
    <div class="f"><label>Рік випуску</label><div class="two"><div class="sel">від 2016</div><div class="sel">до 2024</div></div></div>
    <div class="f"><label>Ціна, $</label><div class="two"><div class="sel">10 000</div><div class="sel">50 000</div></div></div>
    <div class="f"><label>Пробіг, тис. км</label><div class="two"><div class="sel">від</div><div class="sel">до 150</div></div></div>
    <div class="f"><label>Паливо</label><div class="chips"><span class="chip on">Бензин</span><span class="chip">Дизель</span><span class="chip on">Гібрид</span><span class="chip">Електро</span></div></div>
    <div class="f"><label>КПП</label><div class="chips"><span class="chip on">Автомат</span><span class="chip">Механіка</span></div></div>
    <div class="f"><label>Кузов</label><div class="chips"><span class="chip">Седан</span><span class="chip on">Універсал</span><span class="chip">Кросовер</span></div></div>
    <div class="show">Показати 87 авто</div>
  </aside>
  <main>
    <div class="top"><h1>Авто в наявності<span>87 оголошень</span></h1>
      <div class="sort"><span class="pill">Спочатку нові ⌄</span><span class="pill">Сітка</span></div></div>
    <div class="grid" id="g"></div>
  </main>
</div>
<script>
const C=[
['a4.jpg','Audi A4 2.0 TFSI',2020,'58 тис. км','Бензин','Автомат','24 500','Київ','Перевірено','g',14],
['b3.jpg','BMW 330e',2019,'72 тис. км','Гібрид','Автомат','21 900','Львів','Новинка','',11],
['b5g.jpg','BMW 530i xDrive',2018,'94 тис. км','Бензин','Автомат','28 700','Київ','Перевірено','g',18],
['b5w.jpg','BMW 520d',2019,'118 тис. км','Дизель','Автомат','26 400','Одеса','Знижка −$500','',9],
['x5.jpg','BMW X5 xDrive45e',2020,'61 тис. км','Гібрид','Автомат','49 900','Київ','Перевірено','g',22],
['tour.jpg','BMW 320d Touring',2020,'96 тис. км','Дизель','Автомат','27 900','Дніпро','Новинка','',16],
];
const ic={v:'<svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 3 5 3 10c0 2.6 1 4.4 2.5 5.7V21l3.4-2.2c1 .3 2 .4 3.1.4 5.5 0 9-3 9-8.2S17.500 2 12 2zm3.8 11.700c-.3.8-1.500 1.400-2.200 1.200-2.600-.8-4.500-2.400-5.700-5-.2-.6.700-1.500 1.300-1.700.4-.1.700.2.900.600.2.400.4.700.1 1 .600 1.100 1.400 1.800 2.400 2.300.4-.4.500-.7 1-.5.300.2 1 .6 1.300 1 .1.300.1.600-.1 1.100z"/></svg>',
t:'<svg viewBox="0 0 24 24"><path d="M21.500 3.500 2.700 10.800c-.8.300-.8 1.300 0 1.600l4.600 1.500 1.800 5.400c.2.600 1 .8 1.400.3l2.600-2.500 4.700 3.500c.6.400 1.400.1 1.600-.6l3-15.400c.2-.9-.7-1.600-1.500-1.100zM9.500 13.800l7.800-5-6 5.800-.3 2.700z"/></svg>',
c:'<svg viewBox="0 0 24 24"><path d="M6.600 10.800a15 15 0 0 0 6.600 6.600l2.200-2.200a1 1 0 0 1 1-.2c1.100.4 2.300.6 3.600.6a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.500a1 1 0 0 1 1 1c0 1.300.2 2.500.6 3.600a1 1 0 0 1-.2 1z"/></svg>'};
const all=[...C,C[3],C[0],C[5]];
const uah=p=>(Math.round(parseInt(p.replace(' ',''))*41.5/1000)*1000).toLocaleString('uk-UA').replace(/\u00a0/g,' ');
document.getElementById('g').innerHTML=all.slice(0,9).map(c=>`<div class="card"><div class="ph"><img src="assets/${c[0]}"><span class="badge ${c[9]}">${c[8]}</span><span class="heart"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.2"><path d="M12 21s-8-5-8-11a4.500 4.500 0 0 1 8-2.800A4.500 4.500 0 0 1 20 10c0 6-8 11-8 11z"/></svg></span><span class="cnt">${c[10]} фото</span></div>
<div class="bd"><div class="pr"><b>$ ${c[6]}</b><s>≈ ${uah(c[6])} ₴</s></div>
<div class="tt">${c[1]}, ${c[2]}</div><div class="sp"><span>${c[3]}</span><span>${c[4]}</span><span>${c[5]}</span></div>
<div class="ct"><span>${c[7]}</span><span>сьогодні</span></div>
<div class="act"><div class="a" style="background:var(--viber)">${ic.v}Viber</div><div class="a" style="background:var(--tg)">${ic.t}Telegram</div><div class="a" style="background:var(--call)">${ic.c}Подзвонити</div></div></div></div>`).join('');
</script></body></html>
