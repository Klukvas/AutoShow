<!doctype html><html><head><meta charset="utf-8"><title>n1-stack</title><link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@500&family=Onest:wght@500;700&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}body{width:1080px;height:1920px;background:radial-gradient(ellipse 60% 30% at 40% 42%,rgba(123,110,246,.30),transparent 70%),#0a0916;display:grid;place-items:center;font-family:Syne,Onest,sans-serif;overflow:hidden}
