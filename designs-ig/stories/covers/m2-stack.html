<!doctype html><html><head><meta charset="utf-8"><title>m2-stack</title><link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Mono:wght@400;500&family=Onest:wght@500;700&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}body{width:1080px;height:1920px;background:radial-gradient(ellipse 60% 30% at 38% 40%,rgba(123,110,246,.28),transparent 70%),#0a0916;display:grid;place-items:center;font-family:Syne,Onest,sans-serif}
.c{text-align:center}.mono{font-family:'DM Mono',Onest,monospace}</style></head><body><div class="c"><div style="position:relative;width:520px;height:470px;margin:0 auto">
<div style="position:absolute;left:150px;top:0px;width:360px;height:250px;border-radius:26px;background:#2a2647;border:3px solid rgba(123,110,246,.5);padding:22px"></div><div style="position:absolute;left:80px;top:92px;width:360px;height:250px;border-radius:26px;background:#3D32A8;border:3px solid rgba(158,148,249,.7);padding:22px"></div><div style="position:absolute;left:10px;top:184px;width:360px;height:250px;border-radius:26px;background:#f4f3ff;border:3px solid #ffffff;padding:22px"><div style="height:22px;border-radius:8px;background:rgba(10,9,22,.12)"></div>
<div style="display:flex;gap:12px;margin-top:16px"><div style="flex:1.6;height:110px;border-radius:12px;background:#7B6EF6"></div><div style="flex:1;display:grid;gap:12px"><div style="border-radius:10px;background:rgba(10,9,22,.12)"></div><div style="border-radius:10px;background:rgba(10,9,22,.12)"></div></div></div>
<div style="display:flex;gap:12px;margin-top:14px"><div style="flex:1;height:38px;border-radius:8px;background:rgba(10,9,22,.1)"></div><div style="flex:1;height:38px;border-radius:8px;background:rgba(10,9,22,.1)"></div><div style="flex:1;height:38px;border-radius:8px;background:rgba(10,9,22,.1)"></div></div></div></div>
<div style="font-size:90px;font-weight:800;letter-spacing:-4px;color:#fff;line-height:1;margin-top:50px">AutoFlow</div>
<div class="mono" style="font-size:32px;letter-spacing:10px;color:#7B6EF6;margin-top:22px;padding-left:10px">ДИЗАЙНИ</div></div></body></html>
