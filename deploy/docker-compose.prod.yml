# One independent stack per installation; images must be immutable digests.
# Operator values: INSTALLATION_ROOT/.env; artifact values: release.env.
name: ${COMPOSE_PROJECT_NAME:?set stable COMPOSE_PROJECT_NAME}

services:
  caddy:
    image: ${CADDY_IMAGE:?set approved CADDY_IMAGE digest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Media entrypoint in the no-domain (plain-IP) mode; idle otherwise.
      - "8081:8081"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      MEDIA_ADDRESS: ${MEDIA_ADDRESS}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - app

  frontend:
    image: ${FRONTEND_IMAGE:?set pinned FRONTEND_IMAGE}
    restart: unless-stopped
    # No env_file on purpose: the shared .env holds JWT/DB/S3 secrets the
    # Next.js process has no business seeing — an RCE there must not hand
    # over the whole stack. Only what the frontend actually reads:
    environment:
      NODE_ENV: production
      FRONTEND_VERSION: ${FRONTEND_VERSION:?set FRONTEND_VERSION}
      BACKEND_INTERNAL_URL: http://app:3000/api
      ADMIN_COOKIE_NAME: ${ADMIN_COOKIE_NAME}
      ADMIN_COOKIE_DOMAIN: ${ADMIN_COOKIE_DOMAIN:-}
      # From the managed .env: false in plain-HTTP (IP) mode — a Secure cookie
      # over http:// is silently dropped by the browser (= instant logout).
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      ADMIN_COOKIE_SIGNING_KEY: ${ADMIN_COOKIE_SIGNING_KEY}
    depends_on:
      - app

  app:
    image: ${BACKEND_IMAGE:?set pinned BACKEND_IMAGE}
    restart: unless-stopped
    env_file: ${INSTALLATION_ROOT:?set INSTALLATION_ROOT}/.env
    environment:
      APP_VERSION: ${APP_VERSION:?set APP_VERSION}
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    image: ${BACKEND_IMAGE:?set pinned BACKEND_IMAGE}
    restart: unless-stopped
    env_file: ${INSTALLATION_ROOT:?set INSTALLATION_ROOT}/.env
    environment:
      APP_VERSION: ${APP_VERSION:?set APP_VERSION}
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DB_PORT: "5432"
    command: ["node", "dist/src/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE:?set approved POSTGRES_IMAGE digest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:?set approved REDIS_IMAGE digest}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Pinned: `latest` would silently roll on every deploy's compose pull.
    # curl for the healthcheck is verified present in this release.
    image: ${MINIO_IMAGE:?set approved MINIO_IMAGE digest}
    user: root
    entrypoint: ["minio"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: ${MINIO_CLIENT_IMAGE:?set approved MINIO_CLIENT_IMAGE digest}
    # One-shot, but retry on failure: a transient minio hiccup must not leave
    # the bucket missing (all commands inside are idempotent).
    restart: on-failure
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$S3_BUCKET" >/dev/null
        mc anonymous set download "local/$$S3_BUCKET" >/dev/null

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  redis_data:
  minio_data:
